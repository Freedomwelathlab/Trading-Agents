services:
  postgres:
    image: timescale/timescaledb:2.15.3-pg16
    environment:
      POSTGRES_USER: trading_os
      POSTGRES_PASSWORD: trading_os
      POSTGRES_DB: trading_os
    ports:
      - "5432:5432"
    volumes:
      - trading_os_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://trading_os:trading_os@postgres:5432/trading_os
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  trading_os_pgdata:
