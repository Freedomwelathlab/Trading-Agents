name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.15.3-pg16
        env:
          POSTGRES_USER: trading_os
          POSTGRES_PASSWORD: trading_os
          POSTGRES_DB: trading_os
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trading_os"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://trading_os:trading_os@localhost:5432/trading_os
      REDIS_URL: redis://localhost:6379/0
      TRADING_MODE: research
      LIVE_TRADING_ENABLED: "false"
      JWT_SECRET_KEY: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Secret scan (block committed credentials)
        run: |
          if git grep -InE "(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|github_pat_|sk-live-)" -- . ':!*.md'; then
            echo "Potential committed secret found — failing build (spec §38/§51)."
            exit 1
          fi

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy apps

      - name: Run migrations
        run: alembic upgrade head

      - name: Migration round-trip check (upgrade/downgrade/upgrade)
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest -v
