name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.15.3-pg16
        env:
          POSTGRES_USER: trading_os
          POSTGRES_PASSWORD: trading_os
          POSTGRES_DB: trading_os
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trading_os"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://trading_os:trading_os@localhost:5432/trading_os
      REDIS_URL: redis://localhost:6379/0
      TRADING_MODE: research
      LIVE_TRADING_ENABLED: "false"
      JWT_SECRET_KEY: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Secret scan (block committed credentials)
        run: bash scripts/secret_scan.sh

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy apps

      - name: Run migrations
        run: alembic upgrade head

      - name: Migration round-trip check (upgrade/downgrade/upgrade)
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest -v

  # apps/web (Next.js). Independent of the backend job on purpose: these
  # steps need no database, no Redis and no API — `npm test` is Vitest with
  # a mocked fetch. The Playwright e2e suite is deliberately NOT run here;
  # see docs/DECISIONS.md D052 for why that is a separate piece of work.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js + TypeScript)
        run: npm run build

      - name: Unit tests (Vitest)
        run: npm test
