[project]
name = "trading-os"
version = "0.1.0"
description = "AI Trading Operating System — modular multi-asset research, risk, and execution platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "structlog>=24.1",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "longport>=4.3",
    "httpx>=0.27",
    # Phase 90 (D109): broker API secrets are encrypted at rest with
    # Fernet (AES-128-CBC + HMAC-SHA256). The standard library has no AES,
    # and a hand-rolled substitute for authenticated encryption protecting
    # live trading credentials is not a trade this project should make.
    "cryptography>=43.0",
    # zoneinfo has no bundled tz database on Windows, where the US session
    # boundaries in marketdata/sessions.py would otherwise raise
    # ZoneInfoNotFoundError. Linux images read the system tzdata, so this
    # is inert there - it is the development host that needs it declared.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends(...) default-argument pattern is the framework's own
# idiom, not the mutable-default footgun B008 exists to catch.
"apps/api/app/api/**/*.py" = ["B008"]
"apps/api/app/auth/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped loop: apps/api/app/db/base.py creates its async engine once
# at import time, and asyncpg connections are bound to the loop that created
# them. A function-scoped loop (pytest-asyncio's default) would hand a later
# test a connection tied to an already-closed loop from an earlier test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]
